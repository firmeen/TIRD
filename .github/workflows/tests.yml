name: TIRD code validation

on:
  push:
    branches:
      - feat/dual-catalog-parallel-ui
  pull_request:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source code
        run: python -m py_compile tird_collector.py tird_scopes.py tird_ui.py
      - name: Run network-free regression tests
        run: python -m unittest discover -s tests -v
      - name: CLI help smoke test
        run: python tird_collector.py --help
